<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>404 - 页面不存在</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body { min-height: 100vh; padding: 20px; display: flex; align-items: center; justify-content: center; }
        .error-card { width: min(100%, 430px); padding: 46px 32px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-card); text-align: center; }
        .error-code { margin: 0; color: var(--accent); font-size: 76px; font-weight: 750; line-height: 1; letter-spacing: .04em; }
        .error-rule { width: 60px; height: 3px; margin: 22px auto; border-radius: 999px; background: linear-gradient(90deg, #667eea, #764ba2); }
        .error-card p { margin: 0 0 26px; color: var(--ink-2); font-size: 15px; }
        .back-link { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 600; text-decoration: none; transition: background-color 160ms ease, border-color 160ms ease; }
        .back-link:hover { border-color: var(--accent-strong); background: var(--accent-strong); color: #fff; }
        .back-link svg { width: 15px; height: 15px; }
    </style>
</head>
<body>
    {% import '_icons.html' as icons %}
    <main class="error-card">
        <h1 class="error-code">404</h1>
        <div class="error-rule" aria-hidden="true"></div>
        <p>抱歉，您访问的页面不存在</p>
        <a class="back-link" href="/">{{ icons.icon('arrow-left') }}<span>返回首页</span></a>
    </main>
</body>
</html>
